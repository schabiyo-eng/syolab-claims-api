openapi: 3.0.3
info:
  title: Syolab Claims API
  version: 1.0.0
  description: Claims intake API for the Syolab insurance demo. Money amounts are decimal strings.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with a demo user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed bearer token and the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Who the bearer token belongs to
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Adjusters get every policy. Claimants get only the policies they hold.
      responses:
        "200":
          description: Policies in stable policy-number order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/policies/{policyNumber}:
    get:
      operationId: getPolicy
      summary: Get one policy
      description: Claimants get 404 for a policy they don't hold, the same response as for a policy that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/PolicyNumber"
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/claims:
    get:
      operationId: listClaims
      summary: List claims newest first
      description: Adjusters get every claim. Claimants get only claims on policies they hold.
      responses:
        "200":
          description: Claims ordered by createdAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createClaim
      summary: Submit a claim and run validation
      description: Claimants file only on policies they hold. Any other policy number, including one that doesn't exist, returns 404 and stores nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim stored, including rejected and flagged claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/claims/{id}:
    get:
      operationId: getClaim
      summary: Get one claim
      description: Claimants get 404 for a claim on a policy they don't hold, the same response as for a claim that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/claims/{id}/decision:
    post:
      operationId: decideClaim
      summary: Record an adjuster decision on a claim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Claim with updated decision and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/claims/{id}/comments:
    get:
      operationId: listComments
      summary: List comments on a claim
      description: Claimants get 404 for a claim on a policy they don't hold, the same response as for a claim that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createComment
      summary: Add a comment on a claim
      description: Claimants get 404 for a claim on a policy they don't hold, the same response as for a claim that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: The stored comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/audit:
    get:
      operationId: listAudit
      summary: List the append-only audit log
      responses:
        "200":
          description: Audit entries in append order, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PolicyNumber:
      name: policyNumber
      in: path
      required: true
      schema:
        type: string
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: Missing, invalid, or expired bearer token, or wrong credentials on login
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: The caller's role cannot do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: The claim already has a final decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
  schemas:
    Role:
      type: string
      enum: [CLAIMANT, ADJUSTER]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          example: dana
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, username, role, displayName]
      properties:
        token:
          type: string
          description: HS256 JWT. Send as Authorization Bearer. Expires after 8 hours.
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [username, role, displayName]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        displayName:
          type: string
    Policy:
      type: object
      additionalProperties: false
      required:
        - policyNumber
        - holderName
        - status
        - coverageLimit
        - effectiveDate
        - expirationDate
        - requiredDocuments
      properties:
        policyNumber:
          type: string
          example: POL-1001
        holderName:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED]
        coverageLimit:
          type: string
          description: Decimal dollars with two fraction digits, such as 10000.00
          example: "10000.00"
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        requiredDocuments:
          type: array
          items:
            type: string
    CreateClaimRequest:
      type: object
      additionalProperties: false
      required:
        - policyNumber
        - claimantName
        - amount
        - incidentDate
        - description
        - documentNames
      properties:
        policyNumber:
          type: string
        claimantName:
          type: string
        amount:
          type: string
          description: Decimal dollars. More than two fraction digits is a 400.
          example: "250.00"
        incidentDate:
          type: string
          format: date
        description:
          type: string
        documentNames:
          type: array
          items:
            type: string
    Decision:
      type: string
      enum: [PENDING, APPROVED, DENIED, INFO_REQUESTED]
    ActivityAction:
      type: string
      enum: [DECIDED, COMMENTED]
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, DENIED, INFO_REQUESTED]
        note:
          type: string
          description: Required when decision is DENIED or INFO_REQUESTED.
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [at, actor, action, fromDecision, toDecision, note]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          $ref: "#/components/schemas/ActivityAction"
        fromDecision:
          $ref: "#/components/schemas/Decision"
        toDecision:
          $ref: "#/components/schemas/Decision"
        note:
          type: string
          nullable: true
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
    Comment:
      type: object
      additionalProperties: false
      required: [id, at, author, role, body]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        author:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        body:
          type: string
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        [sequence, at, actor, role, action, claimId, fromDecision, toDecision, commentId]
      properties:
        sequence:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        action:
          $ref: "#/components/schemas/ActivityAction"
        claimId:
          type: string
          format: uuid
        fromDecision:
          allOf:
            - $ref: "#/components/schemas/Decision"
          nullable: true
        toDecision:
          allOf:
            - $ref: "#/components/schemas/Decision"
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
    Claim:
      type: object
      additionalProperties: false
      required:
        - id
        - policyNumber
        - claimantName
        - amount
        - incidentDate
        - description
        - documentNames
        - status
        - findings
        - createdAt
        - decision
        - history
      properties:
        id:
          type: string
          format: uuid
        policyNumber:
          type: string
        claimantName:
          type: string
        amount:
          type: string
        incidentDate:
          type: string
          format: date
        description:
          type: string
        documentNames:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACCEPTED, FLAGGED, REJECTED]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"
        payout:
          type: string
          nullable: true
          description: Decimal dollars payable on an ACCEPTED claim, such as 750.00. Null for other statuses.
          example: "750.00"
        createdAt:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/Decision"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - POLICY_NOT_FOUND
            - POLICY_INACTIVE
            - CLAIMANT_NOT_POLICYHOLDER
            - EXCEEDS_COVERAGE
            - MISSING_DOCUMENTS
            - POSSIBLE_FRAUD
        severity:
          type: string
          enum: [ERROR, WARNING]
        message:
          type: string
    ErrorMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
